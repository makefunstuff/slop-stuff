baseURL = "https://makefunstuff.github.io/slop-stuff/"
title = "slop-stuff"
defaultContentLanguage = "en"
enableRobotsTXT = true
canonifyURLs = true
disableKinds = ["taxonomy", "term", "RSS"]
enableGitInfo = false
summaryLength = 20

[languages.en]
  label = "English"
  locale = "en-US"
  title = "slop-stuff"

[params]
  description = "Cheatsheets, guides, and experiments — a dense hacker wiki."
  github = "https://github.com/makefunstuff/slop-stuff"
  tagline = "cheatsheets & experiments"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        title = true
        block = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false
  [markup.highlight]
    noClasses = true
    style = "native"

[outputs]
  home = ["HTML", "JSON"]

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true
